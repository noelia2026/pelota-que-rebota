<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelotita loca</title>
    <style>
        /* Reset: sin márgenes ni scroll, el canvas llena la ventana */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f0e4c0; /* beige, igual que el canvas */
        }
        canvas {
            display: block; /* quita el hueco en línea del canvas */
        }
        /* Título centrado arriba, superpuesto al canvas */
        h1 {
            position: fixed;
            top: 8px;
            left: 0;
            width: 100%;
            margin: 0;
            text-align: center;
            font-family: sans-serif;
            color: #6b5b3e; /* marrón oscuro, legible sobre beige */
            pointer-events: none; /* deja pasar el clic al canvas */
            z-index: 10;
        }
    </style>
     <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <script src="sketch.js"></script>
</head>
<body>
    <h1>Pelotita loca</h1>

</body>
</html>
